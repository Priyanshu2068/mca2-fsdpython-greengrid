services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: greengrid-db
    restart: always
    environment:
      POSTGRES_DB: greengrid_db
      POSTGRES_USER: greengrid_user
      POSTGRES_PASSWORD: greengrid_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greengrid_user -d greengrid_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - greengrid-net

  # ----------------------------------------------------------------------------
  # GreenGrid Web Service (Django REST Framework + Built React SPA)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greengrid-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-greengrid-production-docker-secret-key-32chars
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://greengrid_user:greengrid_password@db:5432/greengrid_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:80,http://localhost,http://127.0.0.1
      - INGESTION_MAX_BATCH_SIZE=5000
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/backend/staticfiles
    networks:
      - greengrid-net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Port 80)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: greengrid-nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
    networks:
      - greengrid-net

volumes:
  pgdata:
  static_volume:

networks:
  greengrid-net:
    driver: bridge

